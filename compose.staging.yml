services:
  hbbs:
    container_name: id_server_hbbs_rustdesk_staging
    image: rustdesk/rustdesk-server:1.1.16
    environment:
      - ALWAYS_USE_RELAY=Y
    command: hbbs

    volumes:
      - ./data-staging:/root

    ports:
      - "22115:21115/tcp"
      - "22116:21116/tcp"
      - "22116:21116/udp"

    depends_on:
      - hbbr

    restart: unless-stopped

  hbbr:
    container_name: relay_server_hbbr_rustdesk_staging
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr

    volumes:
      - ./data-staging:/root

    ports:
      - "672117:21117/tcp"
      - "672119:21119/tcp"

    restart: unless-stopped